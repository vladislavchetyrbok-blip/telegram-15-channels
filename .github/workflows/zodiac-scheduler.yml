name: Zodiac Daily Publisher

on:
  schedule:
    # 06:00 UTC = 09:00 Europe/Kyiv during summer time, 08:00 during winter time.
    # GitHub Actions cron is UTC-only; see docs/zodiac-year-autopilot-runbook.md.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode for manual dispatch"
        required: true
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - live
      date:
        description: "Optional target date YYYY-MM-DD. Empty uses current Europe/Kyiv date."
        required: false
        default: ""

concurrency:
  group: zodiac-daily-publish
  cancel-in-progress: false

jobs:
  publish-zodiac:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      NODE_ENV: "production"
      TELEGRAM_BOT_TOKEN: "${{ secrets.TELEGRAM_BOT_TOKEN }}"
      ZODIAC_GENERAL_CHANNEL_ID: "${{ secrets.ZODIAC_GENERAL_CHANNEL_ID }}"
      ZODIAC_ARIES_CHANNEL_ID: "${{ secrets.ZODIAC_ARIES_CHANNEL_ID }}"
      ZODIAC_TAURUS_CHANNEL_ID: "${{ secrets.ZODIAC_TAURUS_CHANNEL_ID }}"
      ZODIAC_GEMINI_CHANNEL_ID: "${{ secrets.ZODIAC_GEMINI_CHANNEL_ID }}"
      ZODIAC_CANCER_CHANNEL_ID: "${{ secrets.ZODIAC_CANCER_CHANNEL_ID }}"
      ZODIAC_LEO_CHANNEL_ID: "${{ secrets.ZODIAC_LEO_CHANNEL_ID }}"
      ZODIAC_VIRGO_CHANNEL_ID: "${{ secrets.ZODIAC_VIRGO_CHANNEL_ID }}"
      ZODIAC_LIBRA_CHANNEL_ID: "${{ secrets.ZODIAC_LIBRA_CHANNEL_ID }}"
      ZODIAC_SCORPIO_CHANNEL_ID: "${{ secrets.ZODIAC_SCORPIO_CHANNEL_ID }}"
      ZODIAC_SAGITTARIUS_CHANNEL_ID: "${{ secrets.ZODIAC_SAGITTARIUS_CHANNEL_ID }}"
      ZODIAC_CAPRICORN_CHANNEL_ID: "${{ secrets.ZODIAC_CAPRICORN_CHANNEL_ID }}"
      ZODIAC_AQUARIUS_CHANNEL_ID: "${{ secrets.ZODIAC_AQUARIUS_CHANNEL_ID }}"
      ZODIAC_PISCES_CHANNEL_ID: "${{ secrets.ZODIAC_PISCES_CHANNEL_ID }}"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Restore ledger cache
        uses: actions/cache/restore@v4
        with:
          path: data/runtime/zodiac-publish-ledger.json
          key: zodiac-ledger-${{ github.run_id }}
          restore-keys: |
            zodiac-ledger-

      - name: Determine target date and mode
        id: target
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.date }}" ]; then
            TARGET_DATE="${{ inputs.date }}"
          else
            TARGET_DATE=$(TZ="Europe/Kyiv" date +%Y-%m-%d)
          fi

          if [ "${{ github.event_name }}" = "schedule" ]; then
            RUN_MODE="live"
          else
            RUN_MODE="${{ inputs.mode }}"
          fi

          echo "date=$TARGET_DATE" >> "$GITHUB_OUTPUT"
          echo "mode=$RUN_MODE" >> "$GITHUB_OUTPUT"
          echo "Zodiac target date: $TARGET_DATE"
          echo "Zodiac mode: $RUN_MODE"

      - name: Scheduler preflight
        run: npm run zodiac:scheduler:preflight -- --date "${{ steps.target.outputs.date }}" --year-days 365

      - name: Execute Zodiac daily command
        run: |
          if [ "${{ steps.target.outputs.mode }}" = "live" ]; then
            npm run zodiac:publish-date:live -- --date "${{ steps.target.outputs.date }}"
          else
            npm run zodiac:publish-date:dry -- --date "${{ steps.target.outputs.date }}"
          fi

      - name: Generate post-run daily report
        if: always()
        run: |
          mkdir -p data/runtime
          npm run zodiac:report:daily -- --date "${{ steps.target.outputs.date }}" --out "data/runtime/zodiac-daily-report-${{ steps.target.outputs.date }}.json"

      - name: Upload zodiac reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zodiac-reports-${{ steps.target.outputs.date }}
          path: |
            data/runtime/zodiac-daily-report-${{ steps.target.outputs.date }}.json
            data/runtime/zodiac-scheduler-preflight-${{ steps.target.outputs.date }}.json
          if-no-files-found: warn

      - name: Save ledger cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/runtime/zodiac-publish-ledger.json
          key: zodiac-ledger-${{ github.run_id }}
