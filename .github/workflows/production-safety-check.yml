name: Production Safety Check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-safety-check
  cancel-in-progress: false

jobs:
  production-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      NODE_ENV: "production"
      PUBLISH_DUE_STORE: "json"
      TELEGRAM_DRY_RUN: "true"
      TELEGRAM_REAL_PUBLISH_ENABLED: "false"
      DATABASE_URL: "${{ secrets.DATABASE_URL }}"
      SUPABASE_DATABASE_URL: "${{ secrets.SUPABASE_DATABASE_URL }}"
      NEXT_PUBLIC_SUPABASE_URL: "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}"
      SUPABASE_SERVICE_ROLE_KEY: "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
      TELEGRAM_BOT_TOKEN: "${{ secrets.TELEGRAM_BOT_TOKEN }}"
      BACKUP_AGE_RECIPIENT: "${{ vars.BACKUP_AGE_RECIPIENT }}"
      ZODIAC_GENERAL_CHANNEL_ID: "${{ secrets.ZODIAC_GENERAL_CHANNEL_ID }}"
      ZODIAC_ARIES_CHANNEL_ID: "${{ secrets.ZODIAC_ARIES_CHANNEL_ID }}"
      ZODIAC_TAURUS_CHANNEL_ID: "${{ secrets.ZODIAC_TAURUS_CHANNEL_ID }}"
      ZODIAC_GEMINI_CHANNEL_ID: "${{ secrets.ZODIAC_GEMINI_CHANNEL_ID }}"
      ZODIAC_CANCER_CHANNEL_ID: "${{ secrets.ZODIAC_CANCER_CHANNEL_ID }}"
      ZODIAC_LEO_CHANNEL_ID: "${{ secrets.ZODIAC_LEO_CHANNEL_ID }}"
      ZODIAC_VIRGO_CHANNEL_ID: "${{ secrets.ZODIAC_VIRGO_CHANNEL_ID }}"
      ZODIAC_LIBRA_CHANNEL_ID: "${{ secrets.ZODIAC_LIBRA_CHANNEL_ID }}"
      ZODIAC_SCORPIO_CHANNEL_ID: "${{ secrets.ZODIAC_SCORPIO_CHANNEL_ID }}"
      ZODIAC_SAGITTARIUS_CHANNEL_ID: "${{ secrets.ZODIAC_SAGITTARIUS_CHANNEL_ID }}"
      ZODIAC_CAPRICORN_CHANNEL_ID: "${{ secrets.ZODIAC_CAPRICORN_CHANNEL_ID }}"
      ZODIAC_AQUARIUS_CHANNEL_ID: "${{ secrets.ZODIAC_AQUARIUS_CHANNEL_ID }}"
      ZODIAC_PISCES_CHANNEL_ID: "${{ secrets.ZODIAC_PISCES_CHANNEL_ID }}"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check required environment presence
        shell: bash
        run: |
          node <<'NODE'
          const required = [
            "DATABASE_URL",
            "SUPABASE_DATABASE_URL",
            "NEXT_PUBLIC_SUPABASE_URL",
            "SUPABASE_SERVICE_ROLE_KEY",
            "TELEGRAM_BOT_TOKEN",
            "BACKUP_AGE_RECIPIENT",
          ];
          const channelTargets = [
            "ZODIAC_GENERAL_CHANNEL_ID",
            "ZODIAC_ARIES_CHANNEL_ID",
            "ZODIAC_TAURUS_CHANNEL_ID",
            "ZODIAC_GEMINI_CHANNEL_ID",
            "ZODIAC_CANCER_CHANNEL_ID",
            "ZODIAC_LEO_CHANNEL_ID",
            "ZODIAC_VIRGO_CHANNEL_ID",
            "ZODIAC_LIBRA_CHANNEL_ID",
            "ZODIAC_SCORPIO_CHANNEL_ID",
            "ZODIAC_SAGITTARIUS_CHANNEL_ID",
            "ZODIAC_CAPRICORN_CHANNEL_ID",
            "ZODIAC_AQUARIUS_CHANNEL_ID",
            "ZODIAC_PISCES_CHANNEL_ID",
          ];
          const isPresent = (name) => Boolean(String(process.env[name] || "").trim());

          for (const name of required) {
            console.log(`${name}: ${isPresent(name) ? "present" : "missing"}`);
          }

          const presentChannelTargets = channelTargets.filter(isPresent).length;
          console.log(`channel targets: ${presentChannelTargets}/${channelTargets.length} present`);

          if (required.some((name) => !isPresent(name)) || presentChannelTargets !== channelTargets.length) {
            process.exitCode = 1;
          }
          NODE

      - name: Install verified age v1.3.1
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/age-v1.3.1-linux-amd64.tar.gz"
          extract_dir="$RUNNER_TEMP/age-v1.3.1"
          bin_dir="$RUNNER_TEMP/age-bin"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/FiloSottile/age/releases/download/v1.3.1/age-v1.3.1-linux-amd64.tar.gz"
          echo "bdc69c09cbdd6cf8b1f333d372a1f58247b3a33146406333e30c0f26e8f51377  $archive" | sha256sum --check --strict
          mkdir -p "$extract_dir" "$bin_dir"
          tar -xzf "$archive" -C "$extract_dir"
          install -m 0755 "$extract_dir/age/age" "$bin_dir/age"
          echo "$bin_dir" >> "$GITHUB_PATH"
          "$bin_dir/age" --version

      - name: Check Docker availability
        run: docker version --format '{{.Server.Version}}'

      - name: Create fresh system backup manifest
        run: npm run backup:create

      - name: Run isolated restore rehearsal
        run: npm run backup:restore:rehearsal

      - name: Enforce production safety gate
        run: npm run production:safety:gate

      - name: Create encrypted recovery artifact
        id: encrypt_backup
        run: npm run backup:artifact:encrypt

      - name: Upload encrypted recovery artifact
        id: upload_encrypted_artifact
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-production-backup-${{ github.run_id }}
          path: data/runtime/backup-artifacts/*.tar.gz.age
          retention-days: 30
          if-no-files-found: error
          include-hidden-files: false
          compression-level: 0

      - name: Write safe production safety summary
        if: ${{ always() }}
        env:
          BACKUP_ARTIFACT_UPLOAD_OUTCOME: "${{ steps.upload_encrypted_artifact.outcome }}"
          BACKUP_ENCRYPTED_ARTIFACT_NAME: "${{ steps.encrypt_backup.outputs.artifact_name }}"
          BACKUP_ENCRYPTED_ARTIFACT_SHA256: "${{ steps.encrypt_backup.outputs.encrypted_sha256 }}"
          BACKUP_ARTIFACT_RETENTION_DAYS: "${{ steps.encrypt_backup.outputs.retention_days }}"
        run: npm run production:safety:summary

      - name: Remove temporary backup data and containers
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          cleanup_failed=0
          containers="$(docker ps -aq --filter 'name=telegram-15-restore-')"
          if [ -n "$containers" ]; then
            docker rm --force $containers >/dev/null 2>&1 || cleanup_failed=1
          fi
          rm -rf data/backups
          rm -rf data/runtime/backup-artifacts
          rm -rf "$RUNNER_TEMP"/telegram-backup-artifact-*
          rm -rf "$RUNNER_TEMP/age-v1.3.1" "$RUNNER_TEMP/age-v1.3.1-linux-amd64.tar.gz" "$RUNNER_TEMP/age-bin"
          if [ -e data/backups ] || [ -e data/runtime/backup-artifacts ] || compgen -G "$RUNNER_TEMP/telegram-backup-artifact-*" >/dev/null; then
            cleanup_failed=1
          fi
          remaining="$(docker ps -aq --filter 'name=telegram-15-restore-')"
          if [ -n "$remaining" ]; then
            cleanup_failed=1
          fi
          exit "$cleanup_failed"
